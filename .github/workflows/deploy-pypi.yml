name: Deploy PyPI

on:
  push:
  pull_request:
  # PyPI Trusted Publishing identifies the top-level workflow that requests
  # the OIDC token. Keep automated releases as independent dispatches instead
  # of invoking this file as a reusable workflow.
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Exact synchronization commit to build
        required: false
        type: string
        default: ""
      release_tag:
        description: Downstream tag to create and publish
        required: false
        type: string
        default: ""
      upstream_tag:
        description: Exact corresponding Xray-core release tag
        required: false
        type: string
        default: ""
      upstream_prerelease:
        description: Whether the corresponding upstream release is a prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify source ownership and synchronization tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version-file: xray-go/go.mod
          check-latest: true
          cache-dependency-path: xray-go/go.sum
      - name: Verify vendored source and unit tests
        run: |
          python scripts/sync_xray_core.py verify
          python -m unittest discover -s tests
          cd xray-go
          go test ./binding ./main

  build-wheels:
    name: Build wheels (${{ matrix.name }})
    needs: verify-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: windows-x86_64
            os: windows-2022
            arch: AMD64
          - name: windows-arm64
            os: windows-11-arm
            arch: ARM64
          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      # Linux builds run in manylinux containers, so Go is installed by
      # tool.cibuildwheel.linux.before-all inside those containers instead.
      - uses: actions/setup-go@v7
        if: runner.os != 'Linux'
        with:
          go-version-file: xray-go/go.mod
          check-latest: true
          cache-dependency-path: xray-go/go.sum

      - name: Install MinGW-w64
        if: runner.os == 'Windows' && matrix.arch == 'AMD64'
        shell: pwsh
        run: |
          choco install mingw --no-progress --yes
          $mingwBin = 'C:\ProgramData\mingw64\mingw64\bin'
          if (-not (Test-Path -LiteralPath $mingwBin)) {
            throw "MinGW-w64 bin directory was not found: $mingwBin"
          }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # GCC does not target Windows ARM64. Use an ARM-native LLVM-MinGW
      # distribution so Go/cgo and CMake produce compatible ARM64 objects.
      - name: Install LLVM-MinGW for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260616-ucrt-aarch64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip'
          $expectedHash = '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM-MinGW checksum mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $toolchainBin = Get-ChildItem -Path $destination -Filter gcc.exe -File -Recurse |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $toolchainBin) {
            throw 'LLVM-MinGW bin directory was not found'
          }

          $target = & (Join-Path $toolchainBin 'gcc.exe') -dumpmachine
          if ($target -ne 'aarch64-w64-windows-gnu') {
            throw "LLVM-MinGW has the wrong target: $target"
          }
          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test current wheels
        uses: pypa/cibuildwheel@v4.1.1
        with:
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      # cibuildwheel 4 dropped CPython 3.8 and the experimental 3.13t
      # interpreter. Keep the final cibuildwheel 3 release narrowly scoped to
      # those wheels for as long as this project publishes them.
      - name: Build and test CPython 3.8 and 3.13t wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp3{8,13t}-*"
          CIBW_ENABLE: cpython-freethreading

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: verify-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: true
      - name: Build and validate sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*
      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  collect-distributions:
    name: Collect distribution packages
    runs-on: ubuntu-24.04
    needs:
      - build-wheels
      - build-sdist
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Store all distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  guard-release:
    name: Guard automated release state
    if: inputs.release_tag != ''
    needs:
      - collect-distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check Git, GitHub, and PyPI state
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_UPSTREAM_PRERELEASE: ${{ inputs.upstream_prerelease }}
        run: |
          if [[ "$(<UPSTREAM_PRERELEASE)" != "$REQUESTED_UPSTREAM_PRERELEASE" ]]; then
            echo "Workflow dispatch prerelease input disagrees with provenance" >&2
            exit 1
          fi
          python scripts/sync_xray_core.py guard-release \
            --downstream-tag '${{ inputs.release_tag }}' \
            --upstream-tag '${{ inputs.upstream_tag }}'

  create-tag:
    name: Create downstream release tag
    if: inputs.release_tag != ''
    needs:
      - guard-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
      - name: Create and push annotated tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Reusing existing release tag $RELEASE_TAG"
          else
            git tag --annotate "$RELEASE_TAG" --message "Corresponds to Xray-core $UPSTREAM_TAG"
          fi
          git push origin "$RELEASE_TAG"

  publish-to-pypi:
    name: Publish Python distributions to PyPI
    if: >-
      always() &&
      needs.collect-distributions.result == 'success' &&
      (needs.guard-release.result == 'success' || needs.guard-release.result == 'skipped') &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
    needs:
      - collect-distributions
      - guard-release
      - create-tag
    runs-on: ubuntu-24.04
    environment:
      name: deploy-pypi
      url: https://pypi.org/p/Xray-core
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Upload distributions to GitHub Release
    if: >-
      always() &&
      needs.publish-to-pypi.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
    needs:
      - publish-to-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Generate release notes
        run: >-
          python scripts/sync_xray_core.py release-notes
          --output release-notes.md
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo '${{ github.repository }}' \
            --verify-tag \
            --notes-file release-notes.md
      - name: Upload distributions to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release upload
          "$RELEASE_TAG" dist/*
          --repo '${{ github.repository }}'
