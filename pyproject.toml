[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1; python_version == '3.8'",
    "pybind11>=3.0.1,<4; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp3{9,10,11,12,13,14,14t}-*"
skip = "*-musllinux_*"
test-sources = ["sample"]
test-command = "python sample/sample.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
before-all = """
set -eu
go_mod='{package}/xray-go/go.mod'
go_version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' "${go_mod}")"
if [ -z "${go_version}" ]; then
    go_version="$(awk '$1 == "go" { print $2; exit }' "${go_mod}")"
fi
if [ -z "${go_version}" ]; then
    echo "No go or toolchain directive found in ${go_mod}" >&2
    exit 1
fi
case "$(uname -m)" in
    x86_64)
        go_arch='amd64'
        ;;
    aarch64|arm64)
        go_arch='arm64'
        ;;
    *)
        echo "Unsupported Linux architecture: $(uname -m)" >&2
        exit 1
        ;;
esac
go_metadata='/tmp/go-downloads.json'
curl -fsSLo "${go_metadata}" 'https://go.dev/dl/?mode=json&include=all'
go_file_info="$(python -c 'import json, sys; requested, arch = sys.argv[2:]; releases = json.load(open(sys.argv[1], encoding="utf-8")); versions = [release for release in releases if release["version"] == "go" + requested or (requested.count(".") == 1 and release.get("stable") and release["version"].startswith("go" + requested + "."))]; release = versions[0]; file = next(file for file in release["files"] if file["os"] == "linux" and file["arch"] == arch and file["kind"] == "archive"); print(file["filename"], file["sha256"])' "${go_metadata}" "${go_version}" "${go_arch}")"
go_filename="${go_file_info%% *}"
go_sha256="${go_file_info#* }"
go_archive="/tmp/${go_filename}"
curl -fsSLo "${go_archive}" "https://go.dev/dl/${go_filename}"
echo "${go_sha256}  ${go_archive}" | sha256sum -c -
tar -C /usr/local -xzf "${go_archive}"
/usr/local/go/bin/go version
"""
environment = { PATH = "/usr/local/go/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }

[tool.black]
skip-string-normalization = true
