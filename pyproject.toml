[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1; python_version == '3.8'",
    "pybind11>=3.0.1,<4; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp3{8,9,10,11,12,13,14,14t}-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-sources = ["sample"]
test-environment = { PYTHONSAFEPATH = "1" }
test-command = [
    "python sample/sample.py",
    "python -c \"import pathlib, xray; source = pathlib.Path(r'{project}').resolve(); installed = pathlib.Path(xray.__file__).resolve(); assert source not in installed.parents, 'imported source checkout: ' + str(installed)\"",
]

[tool.cibuildwheel.linux]
before-all = [
    "curl -fsSLo /tmp/go1.26.6.linux-amd64.tar.gz https://go.dev/dl/go1.26.6.linux-amd64.tar.gz",
    "echo '708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89  /tmp/go1.26.6.linux-amd64.tar.gz' | sha256sum -c -",
    "tar -C /usr/local -xzf /tmp/go1.26.6.linux-amd64.tar.gz",
    "/usr/local/go/bin/go version",
]
environment = { PATH = "/usr/local/go/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }

[tool.black]
skip-string-normalization = true
