[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1; python_version == '3.8'",
    "pybind11>=3.0.1,<4; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp3{8,9,10,11,12,13,14,14t}-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-sources = ["sample"]
test-environment = { PYTHONSAFEPATH = "1" }
test-command = [
    "python sample/sample.py",
    "python -c \"import pathlib, xray; source = pathlib.Path(r'{project}').resolve(); installed = pathlib.Path(xray.__file__).resolve(); assert source not in installed.parents, 'imported source checkout: ' + str(installed)\"",
]

[tool.cibuildwheel.linux]
before-all = """
case "$(uname -m)" in
    x86_64)
        go_arch='amd64'
        go_sha256='708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89'
        ;;
    aarch64|arm64)
        go_arch='arm64'
        go_sha256='d0507e9e9d7fe012aae570108cbd76c15de879e17130ab8cb90d4d7445cb1f2e'
        ;;
    *)
        echo "Unsupported Linux architecture: $(uname -m)" >&2
        exit 1
        ;;
esac
go_archive="/tmp/go1.26.6.linux-${go_arch}.tar.gz"
curl -fsSLo "${go_archive}" "https://go.dev/dl/go1.26.6.linux-${go_arch}.tar.gz"
echo "${go_sha256}  ${go_archive}" | sha256sum -c -
tar -C /usr/local -xzf "${go_archive}"
/usr/local/go/bin/go version
"""
environment = { PATH = "/usr/local/go/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }

[tool.black]
skip-string-normalization = true
